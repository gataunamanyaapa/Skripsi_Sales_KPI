<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Gelatik — Data Tidak Ditemukan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:#FDE8F2;
         min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{background:#fff;border-radius:20px;
          box-shadow:0 4px 32px rgba(200,24,91,0.12);
          padding:48px 56px;text-align:center;max-width:520px;width:90%;}
    .icon{font-size:52px;margin-bottom:16px;}
    h1{font-size:22px;font-weight:800;color:#1A1A2E;margin-bottom:12px;}
    p{font-size:14px;color:#555577;line-height:1.6;margin-bottom:8px;}
    code{background:#FCE4EC;color:#C2185B;padding:2px 8px;border-radius:6px;font-size:13px;}
    .btn{display:inline-block;margin-top:24px;padding:10px 28px;
         border-radius:10px;background:#E91E8C;color:#fff;
         font-family:inherit;font-size:14px;font-weight:700;
         border:none;cursor:pointer;text-decoration:none;}
    .btn:hover{filter:brightness(0.9);}
    .err{margin-top:16px;background:#fff1f2;border:1.5px solid #fca5a5;
         border-radius:10px;padding:12px 16px;color:#b91c1c;
         font-size:13px;font-weight:600;text-align:left;}
  </style>
</head>
<body>
<div class="card">
  <div class="icon">📂</div>
  <h1>Data Tidak Ditemukan</h1>
  <p>Pastikan file <code>Report.csv</code> ada di folder yang sama dengan <code>app.py</code>.</p>
  <p>Atau gunakan tombol <strong>Import</strong> di dashboard untuk mengunggah file data baru.</p>
  {% if error %}
  <div class="err">{{ error }}</div>
  {% endif %}
  <a href="/" class="btn">↩ Coba Lagi</a>
</div>
</body>
</html>
